[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "automatic-man"
version = "0.0.1"
authors = [
    {name="Machina Ratiocinatrix", email="machina.ratio@gmail.com"},
    {name="Alexander Fedotov", email="alex.fedotov@aol.com"}
]
description = "Automatic-Man ..."
readme = "README.md"
requires-python = ">=3.10"
classifiers=[
        "Programming Language :: Python :: 3",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
]
keywords = ["automatic-man"]
dependencies = [
    "pyyaml == 6.0.3"
]

[project.scripts]
automatic-man = "automatic_man.cli:run"

[project.urls]
"Homepage" = "https://github.com/automatic-man/automatic-man"

[dependency-groups]
dev = ["pytest>=8.0.0"]